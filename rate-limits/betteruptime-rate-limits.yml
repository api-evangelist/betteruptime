specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Better Uptime
providerId: betteruptime
created: '2026-06-12'
modified: '2026-06-12'
reconciled: true
tags:
  - Rate Limiting
description: >-
  Better Stack Uptime API rate limit specifics are not publicly documented. The API
  uses Bearer token authentication and returns standard HTTP 429 responses when limits
  are exceeded, with a Retry-After header indicating when requests may resume. Limits
  are applied per API token. Clients should implement exponential backoff on 429 responses.
sources:
  - https://betterstack.com/docs/uptime/api/getting-started-with-uptime-api/
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
limits:
  - name: Uptime API
    scope: key
    metric: requests_per_minute
    limit: -1
    timeFrame: minute
