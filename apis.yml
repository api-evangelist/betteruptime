---
aid: betteruptime
name: Better Uptime
description: >-
  Better Uptime (now part of Better Stack) is an uptime monitoring and incident
  management platform that helps engineering teams detect outages, manage on-call
  schedules, and communicate incidents through status pages. The platform provides
  a REST API following the JSON:API specification for programmatic management of
  monitors, heartbeats, on-call schedules, status pages, and integrations. Better
  Stack supports Bearer token authentication with both global and team-scoped API
  tokens, and offers a Terraform provider for infrastructure-as-code workflows.
